name: fruits_hub_dashboard
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.10+1
  get_it: ^8.0.2
  image_picker: ^1.1.2
  path: ^1.9.0
  skeletonizer: ^1.4.2
  supabase_flutter: ^2.8.1
  cloud_firestore: ^5.5.1
  dartz: ^0.10.1
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.7
  lottie: ^3.2.0
  firebase_auth: ^5.6.0
  email_validator: ^3.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # dependency to can make icon for my app
  flutter_launcher_icons: ^0.13.1
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/animations/
    - .env

  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

#==================================  Generate  Flutter  Assets  Section  ==============================
flutter_assets:
  assets_path: assets/icons/
  output_path: lib/core/utils/
  filename: assets1.dart
